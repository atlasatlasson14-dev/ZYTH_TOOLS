name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ZYTH_TOOLS.apk

      - name: Save downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZYTH_TOOLS-APK
          path: app/build/outputs/apk/debug/ZYTH_TOOLS.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish or update latest APK release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest app/build/outputs/apk/debug/ZYTH_TOOLS.apk \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest app/build/outputs/apk/debug/ZYTH_TOOLS.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ZYTH TOOLS latest APK" \
              --notes "Automatically built Android APK. Install with Android's package installer." \
              --latest
          fi
